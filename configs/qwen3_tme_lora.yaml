model_name_or_path: "models/Qwen3-4B-Instruct-2507"
data_dir: "data/sft"
output_dir: "runs/tme_lora"
final_adapter_dir: "runs/tme_lora/adapters"

seed: 20260921
device: "auto"
dtype: "bfloat16"

# Approximately three passes over the 500 selected training records.
num_train_epochs: 3
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
weight_decay: 0.01
warmup_ratio: 0.10
lr_scheduler_type: "cosine"

max_seq_length: 2048
# When a prompt is too long, keep its tail and reserve this much repair space.
min_response_tokens: 256
gradient_checkpointing: true
logging_steps: 10
eval_steps: 25
save_steps: 25
save_total_limit: 3

# Match the previous LoRA coverage and effective alpha/r scale (64/32 = 2).
lora:
  rank: 32
  alpha: 64
  dropout: 0.1
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

report_to: "none"
